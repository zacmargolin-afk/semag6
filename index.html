
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semag6 | Games</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0b0b12;
  color: #fff;
  min-height: 100vh;
}

header {
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7%;
  background: #11111c;
  border-bottom: 1px solid #252538;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #a78bfa;
}

.logo span {
  color: #fff;
}

.header-label {
  color: #aaa;
  font-size: 13px;
}

.hero {
  padding: 65px 7% 55px;
  background: radial-gradient(ellipse at top, #29204d 0%, #11111c 65%);
}

.hero h1 {
  font-size: clamp(38px, 7vw, 65px);
  font-weight: 900;
  letter-spacing: -2px;
}

.hero h1 span {
  color: #a78bfa;
}

.hero p {
  color: #aaa;
  margin-top: 15px;
  font-size: 16px;
}

main {
  padding: 35px 7%;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.section-heading h2 {
  font-size: 25px;
}

.game-count {
  color: #999;
  font-size: 13px;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

#search {
  flex: 1;
  min-width: 200px;
  padding: 14px 17px;
  border-radius: 9px;
  border: 1px solid #343449;
  background: #171725;
  color: white;
  outline: none;
  font-size: 14px;
}

#search:focus {
  border-color: #a78bfa;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter {
  background: #191927;
  color: #aaa;
  border: 1px solid #343449;
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.filter:hover,
.filter.active {
  background: #a78bfa;
  color: #100c1c;
  border-color: #a78bfa;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}

.game-card {
  background: #171725;
  border: 1px solid #29293b;
  border-radius: 13px;
  overflow: hidden;
  transition: 0.2s;
}

.game-card:hover {
  transform: translateY(-4px);
  border-color: #a78bfa;
}

.game-art {
  height: 135px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 55px;
  background: linear-gradient(135deg, #30235a, #171725);
}

.game-info {
  padding: 17px;
}

.game-info h3 {
  font-size: 17px;
  margin-bottom: 7px;
}

.game-info p {
  color: #999;
  font-size: 13px;
  margin-bottom: 15px;
}

.play-button {
  display: block;
  text-align: center;
  width: 100%;
  border: 0;
  border-radius: 7px;
  padding: 11px;
  background: #a78bfa;
  color: #100c1c;
  font-weight: bold;
  cursor: pointer;
}

.play-button:hover {
  background: #c4b5fd;
}

.no-results {
  display: none;
  color: #999;
  text-align: center;
  padding: 50px 10px;
  grid-column: 1 / -1;
}

.player {
  display: none;
  margin-top: 35px;
  background: #171725;
  border: 1px solid #343449;
  border-radius: 12px;
  overflow: hidden;
}

.player-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
}

.player-top h2 {
  font-size: 18px;
}

.close-button {
  background: #302b43;
  color: white;
  border: 0;
  border-radius: 6px;
  padding: 9px 14px;
  cursor: pointer;
}

#game-frame {
  width: 100%;
  height: 75vh;
  min-height: 450px;
  border: 0;
  background: #000;
}

footer {
  padding: 30px 7%;
  margin-top: 50px;
  border-top: 1px solid #252538;
  color: #777;
  font-size: 13px;
  text-align: center;
}

@media(max-width: 600px) {
  header {
    padding: 0 5%;
  }

  .hero, main {
    padding-left: 5%;
    padding-right: 5%;
  }

  .header-label {
    display: none;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SEMAG<span>6</span></div>
  <div class="header-label">YOUR GAME HUB</div>
</header>

<section class="hero">
  <h1>PLAY <span>SOMETHING.</span></h1>
  <p>Your games, all in one place.</p>
</section>

<main>

  <div class="section-heading">
    <h2>Explore Games</h2>
    <span class="game-count" id="game-count"></span>
  </div>

  <div class="controls">
    <input
      type="text"
      id="search"
      placeholder="Search games..."
      oninput="filterGames()"
    >
  </div>

  <div class="filters">
    <button class="filter active" onclick="setCategory('All', this)">All games</button>
    <button class="filter" onclick="setCategory('Arcade', this)">Arcade</button>
    <button class="filter" onclick="setCategory('Racing', this)">Racing</button>
    <button class="filter" onclick="setCategory('Sports', this)">Sports</button>
    <button class="filter" onclick="setCategory('Puzzle', this)">Puzzle</button>
    <button class="filter" onclick="setCategory('Other', this)">Other</button>
  </div>

  <br>

  <div class="games-grid" id="games-grid">

    <!-- GAME 1 -->
    <div class="game-card" data-name="CWC Track" data-category="Racing">
      <div class="game-art">🏎️</div>
      <div class="game-info">
        <h3>CWC Track</h3>
        <p>Racing · Browser game</p>
        <button class="play-button" onclick="openGame('CWC Track', 'https://cwctrack.cwcinc.dev/')">
          Play game
        </button>
      </div>
    </div>

    <!-- ADD MORE GAMES HERE -->

<
<div class="game-card" data-name="Hydrovolter GG" data-category="Other">
  <div class="game-art">🎮</div>
  <div class="game-info">
    <h3>Hydrovolter GG</h3>
    <p>Gaming · Online Games</p>
    <button class="play-button"
      onclick="openGame('Hydrovolter GG','https://hydrovolter.pages.dev/gg/')">
      Play game
    </button>
  </div>
</div>


    <div class="no-results" id="no-results">
      No games found. Try another search.
    </div>

  </div>

  <div class="player" id="player">
    <div class="player-top">
      <h2 id="player-title">Game</h2>
      <button class="close-button" onclick="closeGame()">Close game ✕</button>
    </div>

    <iframe id="game-frame" allowfullscreen></iframe>
  </div>

</main>

<footer>
  SEMAG6 · YOUR GAME HUB
</footer>

<script>
let currentCategory = "All";

function setCategory(category, button) {
  currentCategory = category;

  document.querySelectorAll(".filter").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
  filterGames();
}

function filterGames() {
  const search = document.getElementById("search").value.toLowerCase();
  const cards = document.querySelectorAll(".game-card");

  let visible = 0;

  cards.forEach(card => {
    const name = card.dataset.name.toLowerCase();
    const category = card.dataset.category;

    const matchesSearch = name.includes(search);
    const matchesCategory =
      currentCategory === "All" || category === currentCategory;

    if (matchesSearch && matchesCategory) {
      card.style.display = "";
      visible++;
    } else {
      card.style.display = "none";
    }
  });

  document.getElementById("no-results").style.display =
    visible === 0 ? "block" : "none";

  document.getElementById("game-count").textContent =
    visible + (visible === 1 ? " game" : " games");
}

function openGame(name, url) {
  document.getElementById("player-title").textContent = name;
  document.getElementById("game-frame").src = url;
  document.getElementById("player").style.display = "block";

  document.getElementById("player").scrollIntoView({
    behavior: "smooth"
  });
}

function closeGame() {
  document.getElementById("game-frame").src = "";
  document.getElementById("player").style.display = "none";
}

filterGames();
</script>

</body>
</html>
